<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciência LOL">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="icon" href="../ui/img/logo.png">
<link rel="apple-touch-icon" href="../ui/img/logo.png">
<title>Ciência LOL</title>
<style>
  @font-face{font-family:Cinzel;src:url(../ui/fonts/cinzel.ttf) format("truetype");font-weight:400 900;font-display:swap}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#070b14;color:#eef2f8;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{background:radial-gradient(700px 500px at 50% 35%,#14223d,transparent 65%),#070b14;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .logo{width:92px;height:92px;border-radius:24px;box-shadow:0 10px 50px rgba(200,170,110,.35)}
  h1{font:700 24px/1.2 Cinzel,Georgia,serif;margin:18px 0 0;background:linear-gradient(180deg,#fff6e0,#c8aa6e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .spin{width:30px;height:30px;margin:26px auto 0;border-radius:50%;border:3px solid #233049;border-top-color:#0ac8b9;animation:r .9s linear infinite}
  @keyframes r{to{transform:rotate(1turn)}}
  #msg{color:#8d9ab0;margin:18px 0 0;max-width:340px}
  #msg.err{color:#ffb4bf}
  #retry{margin-top:16px;padding:11px 22px;border:1px solid #233049;border-radius:14px;background:#0f1726;color:#f0e6d2;font:600 15px system-ui,sans-serif}
  /* dica de criar o atalho (só quando a pessoa pede) */
  .tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:380px;background:#f0e6d2;color:#1a1206;border-radius:16px;padding:12px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .tip.top{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
  .tip::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#f0e6d2}
  .tip.top::after{bottom:auto;top:-8px;left:auto;right:18px;border-top:0;border-bottom:8px solid #f0e6d2}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <img class="logo" src="../ui/img/logo.png" alt="">
  <h1>Ciência LOL</h1>
  <div class="spin" id="spin"></div>
  <p id="msg" hidden></p>
  <button id="retry" hidden>Tentar de novo</button>
  <div class="tip" id="tip" hidden></div>
<script>
// Link: .../celular/#<caixa>.<chave>[&n][&a][&s=servidor]  (a parte depois do # nunca sai do celular)
// O atalho da tela inicial aponta pra cá (endereço que nunca muda) e daqui vai pra tela do controle.
const h = location.hash.slice(1).split('&');
const [box, key] = (h[0] || '').split('.');
const flags = new Set(h.slice(1).filter(x => !x.startsWith('s=')));
const srvP = h.find(x => x.startsWith('s='));
const SERVER = srvP ? decodeURIComponent(srvP.slice(2)) : 'https://ntfy.sh';
const $ = id => document.getElementById(id);
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const valid = /^clola-[a-z0-9]{10,40}$/.test(box || '') && /^[a-f0-9]{32}$/.test(key || '');

function fail(t) { $('spin').hidden = true; $('msg').hidden = false; $('msg').className = 'err'; $('msg').textContent = t; $('retry').hidden = false; }

// abre a tela do Ciência LOL (ela conversa com o PC pelo ntfy: Wi-Fi ou 4G)
function find() {
  if (!valid) return fail('Este atalho está incompleto. Leia de novo o QR code na aba Celular do Ciência LOL.');
  location.replace('../remote/#' + h.filter(x => x !== 'a').join('&'));
}
$('retry').onclick = find;

if (flags.has('a') && !standalone) {
  // a pessoa pediu pra criar o atalho: tira o "&a" (o atalho abre direto no PC) e mostra só a dica
  history.replaceState(null, '', location.pathname + '#' + h.filter(x => x !== 'a').join('&'));
  $('spin').hidden = true;
  const t = $('tip');
  t.innerHTML = ios ? 'Toque em <b>Compartilhar</b> ⬆︎ e depois em <b>Adicionar à Tela de Início</b>' : 'Toque no menu <b>⋮</b> e depois em <b>Adicionar à tela inicial</b>';
  t.classList.toggle('top', !ios); t.hidden = false;
} else find();
</script>
</body>
</html>
